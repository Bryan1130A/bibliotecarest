<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="cabecera">
        <div class="marca">
            <span class="logo">B</span>
            <div>
                <h1>Biblioteca</h1>
                <p>Gestión de libros y categorías</p>
            </div>
        </div>
        <div class="sesion">
            <input id="usuario" type="text" placeholder="Usuario" value="admin">
            <input id="clave" type="password" placeholder="Contraseña">
        </div>
    </header>

    <main class="contenedor">
        <section class="resumen">
            <div class="tarjeta-dato"><span id="totalLibros">0</span><small>Libros</small></div>
            <div class="tarjeta-dato"><span id="totalCategorias">0</span><small>Categorías</small></div>
            <div class="tarjeta-dato"><span id="totalStock">0</span><small>Ejemplares</small></div>
        </section>

        <div class="pestanas">
            <button class="pestana activa" data-vista="vistaLibros">Libros</button>
            <button class="pestana" data-vista="vistaCategorias">Categorías</button>
        </div>

        <section id="vistaLibros" class="vista activa">
            <div class="panel">
                <h2>Nuevo libro</h2>
                <form id="formLibro" class="formulario">
                    <label>Título<input name="titulo" required></label>
                    <label>Autor<input name="autor" required></label>
                    <label>Editorial<input name="editorial"></label>
                    <label>ISBN<input name="isbn"></label>
                    <label>Año de publicación<input name="anioPublicacion" type="number" min="0"></label>
                    <label>Número de páginas<input name="numeroPaginas" type="number" min="1"></label>
                    <label>Idioma<input name="idioma" value="Español"></label>
                    <label>Precio<input name="precio" type="number" step="0.01" min="0"></label>
                    <label>Stock<input name="stock" type="number" min="0" value="1"></label>
                    <label>Categoría<select name="categoria" id="selectCategoria"></select></label>
                    <label class="check"><input name="disponible" type="checkbox" checked> Disponible</label>
                    <button type="submit" class="boton">Guardar libro</button>
                </form>
            </div>

            <div class="panel">
                <div class="panel-cabecera">
                    <h2>Libros</h2>
                    <input id="buscar" type="search" placeholder="Buscar por título o autor">
                </div>
                <div class="tabla-envoltura">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th><th>Título</th><th>Autor</th><th>Editorial</th><th>ISBN</th>
                                <th>Año</th><th>Págs.</th><th>Idioma</th><th>Categoría</th>
                                <th>Precio</th><th>Stock</th><th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tablaLibros"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="vistaCategorias" class="vista">
            <div class="panel">
                <h2>Nueva categoría</h2>
                <form id="formCategoria" class="formulario">
                    <label>Nombre<input name="nombre" required></label>
                    <label class="ancho">Descripción<input name="descripcion"></label>
                    <button type="submit" class="boton">Guardar categoría</button>
                </form>
            </div>
            <div class="panel">
                <h2>Categorías</h2>
                <div class="tabla-envoltura">
                    <table>
                        <thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th></tr></thead>
                        <tbody id="tablaCategorias"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div id="aviso" class="aviso"></div>
    <script src="/js/app.js"></script>
</body>
</html>
